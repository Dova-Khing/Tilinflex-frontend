<!-- HERO - Trending -->
<section class="relative w-full h-[500px] overflow-hidden" *ngIf="trending.length > 0">
  <img
    [src]="'https://image.tmdb.org/t/p/original' + trending[0].backdrop_path"
    class="w-full h-full object-cover"
    alt="hero"
  />
  <div class="absolute inset-0 bg-gradient-to-t from-black via-black/60 to-transparent"></div>
  <div class="absolute bottom-10 left-8">
    <h1 class="text-4xl font-bold text-white mb-2">
      {{ trending[0].title || trending[0].name }}
    </h1>
    <p class="text-gray-300 max-w-xl text-sm line-clamp-3">{{ trending[0].overview }}</p>
    <a
      [routerLink]="['/obra', trending[0].id]"
      [queryParams]="{ type: getType(trending[0]) }"
      class="mt-4 inline-block bg-red-600 hover:bg-red-700 text-white px-6 py-2 rounded font-semibold transition"
    >
      Ver ahora
    </a>
  </div>
</section>

<!-- TRENDING -->
<section class="px-8 py-6">
  <h2 class="text-xl font-bold text-white mb-4">Tendencias</h2>
  <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
    <a
      *ngFor="let item of trending"
      [routerLink]="['/obra', item.id]"
      [queryParams]="{ type: getType(item) }"
      class="group cursor-pointer"
    >
      <div class="relative overflow-hidden rounded-lg aspect-[2/3]">
        <img
          [src]="getImage(item.poster_path)"
          [alt]="item.title || item.name"
          class="w-full h-full object-cover group-hover:scale-105 transition duration-300"
        />
        <div class="absolute inset-0 bg-black/0 group-hover:bg-black/40 transition"></div>
      </div>
      <p class="text-sm text-gray-300 mt-2 truncate">{{ item.title || item.name }}</p>
    </a>
  </div>
</section>
