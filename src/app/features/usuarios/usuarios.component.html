<div class="page">
  <div class="page-header">
    <h1 class="page-title">Usuarios</h1>
    <button class="btn btn-primary" (click)="abrirCrear()">+ Crear usuario</button>
  </div>

  <div *ngIf="error" class="error-msg">{{ error }}</div>

  <div class="card">
    <div *ngIf="cargando" class="loading">Cargando usuarios...</div>
    <table *ngIf="!cargando" class="data-table">
      <thead>
        <tr>
          <th>#</th>
          <th>Nombre</th>
          <th>Email</th>
          <th>País</th>
          <th>Rol</th>
          <th style="text-align:center">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let u of usuarios; let i = index">
          <td class="text-muted">{{ i + 1 }}</td>
          <td class="text-bold">{{ u.nombre }} {{ u.apellido }}</td>
          <td class="text-muted">{{ u.email }}</td>
          <td>{{ u.pais }}</td>
          <td>
            <span class="badge" [ngClass]="u.admin ? 'mensual' : ''">
              {{ u.admin ? 'Admin' : 'Usuario' }}
            </span>
          </td>
          <td style="text-align:center;white-space:nowrap">
            <button class="btn btn-secondary btn-sm" (click)="abrirEditar(u)" style="margin-right:6px">Editar</button>
            <button class="btn btn-danger btn-sm" (click)="eliminar(u.id_usuario)">Eliminar</button>
          </td>
        </tr>
        <tr *ngIf="usuarios.length === 0">
          <td colspan="6" class="empty-state">No hay usuarios registrados</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<div *ngIf="mostrarModal" class="modal-overlay">
  <div class="modal">
    <h2 class="modal-title">{{ editando ? 'Editar usuario' : 'Nuevo usuario' }}</h2>

    <div class="form-grid-2">
      <div class="form-group">
        <label class="form-label">Nombre</label>
        <input [(ngModel)]="form.nombre" class="form-input" placeholder="Juan" />
      </div>
      <div class="form-group">
        <label class="form-label">Apellido</label>
        <input [(ngModel)]="form.apellido" class="form-input" placeholder="Pérez" />
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Email</label>
      <input type="email" [(ngModel)]="form.email" class="form-input" placeholder="correo@ejemplo.com" />
    </div>

    <div class="form-group" *ngIf="!editando">
      <label class="form-label">Contraseña</label>
      <input type="password" [(ngModel)]="form.contrasena" class="form-input" placeholder="••••••••" />
    </div>

    <div class="form-grid-2">
      <div class="form-group">
        <label class="form-label">Edad</label>
        <input type="number" [(ngModel)]="form.edad" class="form-input" placeholder="18" />
      </div>
      <div class="form-group">
        <label class="form-label">País</label>
        <input [(ngModel)]="form.pais" class="form-input" placeholder="Colombia" />
      </div>
    </div>

    <label class="form-check">
      <input type="checkbox" [(ngModel)]="form.admin" />
      Administrador
    </label>

    <div class="modal-actions">
      <button class="btn btn-primary" (click)="guardar()">{{ editando ? 'Guardar' : 'Crear' }}</button>
      <button class="btn btn-secondary" (click)="cerrar()">Cancelar</button>
    </div>
  </div>
</div>
