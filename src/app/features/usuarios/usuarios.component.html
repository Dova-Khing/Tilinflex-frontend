<div class="flex items-center justify-between mb-6">
  <h2 class="text-2xl font-bold text-white">Usuarios</h2>
  <button (click)="abrirCrear()"
    class="bg-red-600 hover:bg-red-700 text-white text-sm px-4 py-2 rounded-lg transition">
    + Crear usuario
  </button>
</div>

<div *ngIf="error" class="text-red-400 mb-4 text-sm">{{ error }}</div>
<div *ngIf="cargando" class="text-zinc-400">Cargando...</div>

<div *ngIf="!cargando" class="overflow-x-auto rounded-xl">
  <table class="w-full text-sm text-left text-zinc-300">
    <thead class="text-xs text-zinc-400 uppercase bg-zinc-800">
      <tr>
        <th class="px-4 py-3">Nombre</th>
        <th class="px-4 py-3">Email</th>
        <th class="px-4 py-3">País</th>
        <th class="px-4 py-3">Admin</th>
        <th class="px-4 py-3">Estado</th>
        <th class="px-4 py-3 text-center">Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let u of usuarios" class="border-b border-zinc-800 hover:bg-zinc-900 transition">
        <td class="px-4 py-3 text-white font-medium">{{ u.nombre }} {{ u.apellido }}</td>
        <td class="px-4 py-3">{{ u.email }}</td>
        <td class="px-4 py-3">{{ u.pais }}</td>
        <td class="px-4 py-3">
          <span [class]="u.admin ? 'text-yellow-400' : 'text-zinc-500'">{{ u.admin ? 'Admin' : 'Usuario' }}</span>
        </td>
        <td class="px-4 py-3">
          <span [class]="u.activo ? 'text-green-400' : 'text-red-400'">{{ u.activo ? 'Activo' : 'Inactivo' }}</span>
        </td>
        <td class="px-4 py-3 flex gap-2 justify-center">
          <button (click)="abrirEditar(u)"
            class="bg-zinc-700 hover:bg-zinc-600 text-white px-3 py-1 rounded text-xs transition">
            Editar
          </button>
          <button (click)="eliminar(u.id_usuario)"
            class="bg-red-700 hover:bg-red-600 text-white px-3 py-1 rounded text-xs transition">
            Eliminar
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<!-- MODAL -->
<div *ngIf="mostrarModal" class="fixed inset-0 bg-black/70 flex items-center justify-center z-50">
  <div class="bg-zinc-900 rounded-xl p-6 w-full max-w-md shadow-xl">
    <h3 class="text-white font-bold text-lg mb-4">{{ editando ? 'Editar' : 'Crear' }} usuario</h3>

    <div class="space-y-3">
      <div class="grid grid-cols-2 gap-3">
        <input [(ngModel)]="form.nombre" placeholder="Nombre"
          class="w-full bg-zinc-800 text-white rounded-lg px-4 py-2 text-sm outline-none focus:ring-2 focus:ring-red-600" />
        <input [(ngModel)]="form.apellido" placeholder="Apellido"
          class="w-full bg-zinc-800 text-white rounded-lg px-4 py-2 text-sm outline-none focus:ring-2 focus:ring-red-600" />
      </div>
      <input [(ngModel)]="form.email" type="email" placeholder="Email"
        class="w-full bg-zinc-800 text-white rounded-lg px-4 py-2 text-sm outline-none focus:ring-2 focus:ring-red-600" />
      <input *ngIf="!editando" [(ngModel)]="form.contrasena" type="password" placeholder="Contraseña"
        class="w-full bg-zinc-800 text-white rounded-lg px-4 py-2 text-sm outline-none focus:ring-2 focus:ring-red-600" />
      <div class="grid grid-cols-2 gap-3">
        <input [(ngModel)]="form.edad" type="number" placeholder="Edad"
          class="w-full bg-zinc-800 text-white rounded-lg px-4 py-2 text-sm outline-none focus:ring-2 focus:ring-red-600" />
        <input [(ngModel)]="form.pais" placeholder="País"
          class="w-full bg-zinc-800 text-white rounded-lg px-4 py-2 text-sm outline-none focus:ring-2 focus:ring-red-600" />
      </div>
      <label class="flex items-center gap-2 text-zinc-400 text-sm cursor-pointer">
        <input type="checkbox" [(ngModel)]="form.admin" class="accent-red-600" />
        Es administrador
      </label>
    </div>

    <div class="flex gap-3 mt-5">
      <button (click)="guardar()"
        class="flex-1 bg-red-600 hover:bg-red-700 text-white py-2 rounded-lg text-sm font-semibold transition">
        {{ editando ? 'Guardar cambios' : 'Crear' }}
      </button>
      <button (click)="cerrar()"
        class="flex-1 bg-zinc-700 hover:bg-zinc-600 text-white py-2 rounded-lg text-sm transition">
        Cancelar
      </button>
    </div>
  </div>
</div>
