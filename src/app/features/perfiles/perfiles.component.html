<div class="perfiles-page">
  <div class="perfiles-container">

    <h1 class="titulo">¿Quién está viendo?</h1>

    <div *ngIf="cargando" class="loading">
      <div class="spinner"></div>
    </div>

    <div *ngIf="!cargando" class="perfiles-grid">

      <div
        *ngFor="let p of perfiles; let i = index"
        class="perfil-card"
        [class.edicion]="modoEdicion"
        [style.animation-delay]="(i * 80) + 'ms'"
        (click)="seleccionar(p)"
      >
        <div class="avatar-wrap">
          <img [src]="avatarUrl(p.avatar_url)" [alt]="p.nombre_usuario" class="avatar" />
          <div class="avatar-glow"></div>
          <div *ngIf="modoEdicion" class="edicion-overlay">
            <button class="btn-icono" (click)="abrirEditar(p, $event)">✏️</button>
            <button class="btn-icono danger" (click)="eliminar(p, $event)">🗑️</button>
          </div>
        </div>
        <span class="perfil-nombre">{{ p.nombre_usuario }}</span>
        <span *ngIf="p.es_infantil" class="badge-kids">Kids</span>
      </div>

      <div *ngIf="perfiles.length < MAX" class="perfil-card add-card" (click)="abrirCrear()">
        <div class="avatar-wrap add-avatar">
          <span class="add-icon">+</span>
        </div>
        <span class="perfil-nombre">Añadir perfil</span>
      </div>

    </div>

    <button class="btn-gestionar" (click)="modoEdicion = !modoEdicion">
      {{ modoEdicion ? 'Listo' : 'Gestionar perfiles' }}
    </button>

  </div>
</div>

<!-- MODAL -->
<div *ngIf="mostrarModal" class="modal-overlay" (click)="cerrar()">
  <div class="modal" (click)="$event.stopPropagation()">
    <h2 class="modal-titulo">{{ editando ? 'Editar perfil' : 'Nuevo perfil' }}</h2>

    <!-- Preview avatar -->
    <div class="avatar-preview-wrap">
      <label class="avatar-preview-label" title="Subir foto">
        <img [src]="avatarUrl(form.avatar_url)" class="avatar-preview-img" alt="Avatar" />
        <div class="avatar-camera-overlay">📷</div>
        <input type="file" accept="image/*" (change)="onFotoSeleccionada($event)" hidden />
      </label>
      <p class="avatar-hint">Toca para subir tu foto</p>
    </div>

    <!-- Grid predefinidos -->
    <div class="avatar-picker">
      <div
        *ngFor="let av of avatarOptions()"
        class="avatar-opcion"
        [class.selected]="form.avatar_url === av"
        (click)="form.avatar_url = av"
        title="Avatar {{ av }}"
      >
        <img [src]="avatarUrl(av)" [alt]="av" loading="lazy" />
      </div>
    </div>

    <input
      [(ngModel)]="form.nombre_usuario"
      class="form-input"
      placeholder="Nombre del perfil"
      maxlength="20"
      (keydown.enter)="guardar()"
    />

    <label class="check-label">
      <input type="checkbox" [(ngModel)]="form.es_infantil" />
      Perfil infantil (Kids)
    </label>

    <p *ngIf="error" class="error-msg">{{ error }}</p>

    <div class="modal-acciones">
      <button class="btn-guardar" (click)="guardar()">{{ editando ? 'Guardar cambios' : 'Crear perfil' }}</button>
      <button class="btn-cancelar" (click)="cerrar()">Cancelar</button>
    </div>
  </div>
</div>
