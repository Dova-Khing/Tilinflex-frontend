<div class="page">

  <!-- HEADER -->
  <div class="page-header">
    <div>
      <h2 class="page-title">Obras</h2>
      <p class="page-subtitle">Gestión de obras registradas</p>
    </div>
    <button (click)="abrirCrear()" class="btn-primary">+ Crear obra</button>
  </div>

  <!-- ERROR -->
  <div *ngIf="error" class="alert-error">{{ error }}</div>

  <!-- LOADING -->
  <div *ngIf="cargando" class="loading">Cargando obras...</div>

  <!-- TABLA -->
  <div *ngIf="!cargando" class="card">
    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Nombre</th>
            <th>Descripción</th>
            <th>Año</th>
            <th>Episodios</th>
            <th class="center">Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let obra of obras; let i = index">
            <td class="muted">{{ i + 1 }}</td>
            <td class="bold">{{ obra.nombre }}</td>
            <td class="truncate-cell">{{ obra.descripcion }}</td>
            <td>{{ obra.anio }}</td>
            <td>{{ obra.episodios }}</td>
            <td class="center">
              <div class="actions">
                <button (click)="abrirEditar(obra)" class="btn-edit">Editar</button>
                <button (click)="eliminar(obra.id_obra)" class="btn-delete">Eliminar</button>
              </div>
            </td>
          </tr>
          <tr *ngIf="obras.length === 0">
            <td colspan="6" class="empty">No hay obras registradas aún</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<!-- MODAL -->
<div *ngIf="mostrarModal" class="modal-overlay">
  <div class="modal">
    <h3 class="modal-title">{{ editando ? 'Editar' : 'Crear' }} obra</h3>

    <div class="form-grid">
      <div class="form-group full">
        <label>Nombre</label>
        <input [(ngModel)]="form.nombre" placeholder="Nombre de la obra" />
      </div>
      <div class="form-group full">
        <label>Descripción</label>
        <textarea [(ngModel)]="form.descripcion" placeholder="Descripción" rows="3"></textarea>
      </div>
      <div class="form-group">
        <label>Año</label>
        <input [(ngModel)]="form.anio" type="number" placeholder="2024" />
      </div>
      <div class="form-group">
        <label>Episodios</label>
        <input [(ngModel)]="form.episodios" type="number" placeholder="1" />
      </div>
      <div class="form-group">
        <label>ID Categoría</label>
        <input [(ngModel)]="form.id_categoria" placeholder="ID Categoría" />
      </div>
      <div class="form-group">
        <label>ID Género</label>
        <input [(ngModel)]="form.id_genero" placeholder="ID Género" />
      </div>
    </div>

    <div class="modal-actions">
      <button (click)="cerrar()" class="btn-cancel">Cancelar</button>
      <button (click)="guardar()" class="btn-primary">
        {{ editando ? 'Guardar cambios' : 'Crear obra' }}
      </button>
    </div>
  </div>
</div>
