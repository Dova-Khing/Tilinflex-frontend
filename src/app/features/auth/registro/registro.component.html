<div class="registro-page">
  <div class="registro-card">

    <h1 class="registro-title">Crear cuenta</h1>
    <p class="registro-subtitle">Únete a Tilinflex</p>

    <div *ngIf="error" class="registro-error">
      {{ error }}
    </div>

    <form class="registro-form" (ngSubmit)="registro()" #form="ngForm">

      <div class="field-grid">
        <div class="field">
          <label class="field__label">Nombre</label>
          <input class="field__input" type="text" [(ngModel)]="nombre" name="nombre" required />
        </div>
        <div class="field">
          <label class="field__label">Apellido</label>
          <input class="field__input" type="text" [(ngModel)]="apellido" name="apellido" required />
        </div>
      </div>

      <div class="field">
        <label class="field__label">Email</label>
        <input class="field__input" type="email" [(ngModel)]="email" name="email" required />
      </div>

      <div class="field">
        <label class="field__label">Contraseña</label>
        <input class="field__input" type="password" [(ngModel)]="contrasena" name="contrasena" required />
      </div>

      <div class="field-grid">
        <div class="field">
          <label class="field__label">Edad</label>
          <input class="field__input" type="number" [(ngModel)]="edad" name="edad" required />
        </div>
        <div class="field">
          <label class="field__label">País</label>
          <input class="field__input" type="text" [(ngModel)]="pais" name="pais" required />
        </div>
      </div>

      <button class="registro-btn" type="submit" [disabled]="cargando">
        {{ cargando ? 'Creando cuenta...' : 'Crear cuenta' }}
      </button>

    </form>

    <p class="registro-footer">
      ¿Ya tienes cuenta?
      <a routerLink="/login">Inicia sesión</a>
    </p>

  </div>
</div>
