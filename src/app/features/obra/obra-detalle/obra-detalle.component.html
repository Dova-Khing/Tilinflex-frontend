<div *ngIf="obra" class="min-h-screen bg-black text-white">

  <!-- Backdrop -->
  <div class="relative w-full h-[300px]">
    <img [src]="getImage(obra.backdrop_path)" class="w-full h-full object-cover" alt="backdrop" />
    <div class="absolute inset-0 bg-gradient-to-t from-black to-transparent"></div>
  </div>

  <!-- Info -->
  <div class="px-8 py-6 flex gap-6">
    <img
      [src]="'https://image.tmdb.org/t/p/w300' + obra.poster_path"
      class="w-36 rounded-lg shadow-lg -mt-20 relative z-10"
      [alt]="obra.title || obra.name"
    />
    <div class="flex-1">
      <h1 class="text-3xl font-bold">{{ obra.title || obra.name }}</h1>
      <p class="text-gray-400 text-sm mt-1">
        {{ obra.release_date || obra.first_air_date | date:'yyyy' }} •
        {{ type === 'movie' ? 'Película' : 'Serie' }} •
        ⭐ {{ obra.vote_average | number:'1.1-1' }}
      </p>
      <p class="text-gray-300 mt-4 max-w-2xl">{{ obra.overview }}</p>
    </div>
  </div>

  <!-- Player -->
  <div class="px-8 py-4">
    <h2 class="text-xl font-bold mb-4">Reproducir</h2>
    <div class="relative w-full aspect-video rounded-lg overflow-hidden bg-gray-900">
      <iframe
        *ngIf="streamUrl"
        [src]="streamUrl"
        class="w-full h-full"
        allowfullscreen
        allow="autoplay; fullscreen"
        frameborder="0"
      ></iframe>
    </div>
  </div>

</div>

<div *ngIf="!obra" class="flex items-center justify-center min-h-screen">
  <p class="text-gray-400">Cargando...</p>
</div>
